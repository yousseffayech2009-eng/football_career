<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Football Career - Tunisian League Start</title>
    <style>
        body { background-color: #0b132b; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 12px; direction: rtl; }
        #game-container { max-width: 500px; margin: 0 auto; }
        .card { background: #1c2541; border-radius: 12px; padding: 18px; margin-top: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: right; }
        button { cursor: pointer; font-weight: bold; border-radius: 8px; border: none; width: 100%; padding: 14px; font-size: 15px; margin-top: 8px; background-color: #5bc0be; color: #0b132b; }
        .match-box-style { background: #0b132b; padding: 12px; border-radius: 8px; margin: 10px 0; border: 1px solid #5bc0be; }
        .teams-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .teams-list li { padding: 6px 0; border-bottom: 1px solid #3a506b; font-size: 14px; }
        .badge { background: #1b263b; padding: 10px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; line-height: 1.8; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- الواجهة الرئيسية -->
        <div id="main-screen" class="card">
            <h2 style="text-align: center; margin: 0 0 10px 0;">⚽ Football Career</h2>
            
            <div class="badge">
                👤 اللاعب: <strong id="p-name">player</strong><br>
                🛡️ النادي: <strong id="p-club">--</strong> (<span id="p-stars">3</span> ⭐)<br>
                🌍 الدوري: <strong id="p-league">--</strong><br>
                📅 الموسم: <strong id="p-season">1</strong> (الجولة <strong id="p-match-round">0</strong> من 30)<br>
                🏆 النقاط: <strong id="p-points">0</strong> | 📊 الترتيب الحالي: <strong id="p-rank">-</strong> | ⚽ الأهداف: <strong id="p-goals">0</strong>
            </div>
            
            <div id="match-box" class="match-box-style">
                <h4 style="margin: 0 0 5px 0;">🏟️ المواجهة القادمة</h4>
                <p id="match-announcement" style="margin: 0; font-size: 14px;">أهلاً بك يا player! تبدأ المسيرة من الدوري التونسي. اضغط خوض الجولة للبدء.</p>
            </div>

            <!-- سوق الانتقالات عند نهاية الموسم -->
            <div id="transfer-offer-box" style="display:none; background: #3a1c0b; padding: 12px; border-radius: 8px; margin: 10px 0; border: 2px solid #ffb703;">
                <h4 style="margin-top:0;">🌟 عروض الانتقالات لنهاية الموسم</h4>
                <div id="continental-result-box" style="margin-bottom: 8px; font-weight: bold; color: #6fffe9; font-size: 13px;"></div>
                <div id="offers-list-container"></div>
                <button id="reject-btn" style="background-color: #e76f51; color: #fff; margin-top: 8px;">البقاء مع ناديك الحالي 🛡️</button>
            </div>

            <div id="action-buttons">
                <button id="play-match-btn">خوض الجولة الحالية ⚽</button>
                <button id="teams-btn" style="background-color: #3a506b; color: #fff; font-size: 13px; padding: 10px;">ترتيب أندية الدوري 📊</button>
                <button id="reset-btn" style="background-color: #d90429; color: #fff; font-size: 12px; padding: 8px;">إعادة تعيين وبدء مسيرة جديدة 🔄</button>
            </div>
        </div>

        <!-- شاشة ترتيب الأندية -->
        <div id="teams-screen" class="card" style="display:none;">
            <h3 id="table-title">ترتيب أندية الدوري</h3>
            <ul id="teams-list-ul" class="teams-list"></ul>
            <button id="back-from-teams" style="background-color: #3a506b; color: #fff;">العودة للوحة القيادة</button>
        </div>
    </div>

            ],
            "الدوري الصربي 🇷🇸": [
                { name: "النجم الأحمر", stars: 4.5, points: 0 },
                { name: "بارتيزان بلغراد", stars: 4.0, points: 0 },
                { name: "تشوكاريتشكي", stars: 3.5, points: 0 },
                { name: "رادنيتشكي نيش", stars: 3.5, points: 0 },
                { name: "فويفودينا", stars: 3.5, points: 0 },
                { name: "باتشكا توبولا", stars: 3.5, points: 0 },
                { name: "نوفي بازار", stars: 2.5, points: 0 },
                { name: "ملادوست لوتشاني", stars: 2.5, points: 0 },
                { name: "رادنيتشكي كراغوييفاتس", stars: 2.5, points: 0 },
                { name: "يافيل", stars: 2.0, points: 0 },
                { name: "نبريداك كروشيفاتس", stars: 2.0, points: 0 },
                { name: "إم إل إيتش", stars: 2.0, points: 0 },
                { name: "يافور إيفانييتشا", stars: 2.0, points: 0 },
                { name: "جيهليكا", stars: 2.0, points: 0 },
                { name: "شاتش", stars: 2.0, points: 0 },
                { name: "وفيلي", stars: 2.0, points: 0 }
            ]
        };

        let player = { name: "player", league: "", club: "", clubStars: 3, season: 1, goals: 0, matchesPlayed: 0, points: 0, rank: 10 };
        let currentLeagueTeams = [];

        function bindAction(id, fn) {
            let el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('click', fn);
            el.addEventListener('touchend', function(e) { e.preventDefault(); fn(); }, {passive: false});
        }

        window.addEventListener('DOMContentLoaded', function() {
            let saved = localStorage.getItem('separated_fc_save');
            if (saved) {
                try {
                    let data = JSON.parse(saved);
                    player = data.player;
                    player.name = "player";
                    currentLeagueTeams = data.teams;
                    if (!player.club || !currentLeagueTeams || currentLeagueTeams.length === 0) {
                        initNewCareer();
                    }
                } catch(e) {
                    initNewCareer();
                }
            } else {
                initNewCareer();
            }

            updateUI();

            bindAction('play-match-btn', playMatch);
            bindAction('teams-btn', function() { renderTeamsTable(); showView('teams-screen'); });
            bindAction('back-from-teams', function() { showView('main-screen'); });
            bindAction('reset-btn', resetCareer);
            bindAction('reject-btn', rejectOffers);
        });

        function initNewCareer() {
            // البدء حصرياً من الدوري التونسي
            let defaultLeagueKey = "الدوري التونسي 🇹🇳";
            let teamsList = leaguesData[defaultLeagueKey];
            let randTeam = teamsList[Math.floor(Math.random() * teamsList.length)];

            currentLeagueTeams = JSON.parse(JSON.stringify(teamsList));
            player = { name: "player", league: defaultLeagueKey, club: randTeam.name, clubStars: randTeam.stars, season: 1, goals: 0, matchesPlayed: 0, points: 0, rank: 10 };
            currentLeagueTeams.forEach(t => t.points = 0);
            saveData();
        }

        function saveData() {
            localStorage.setItem('separated_fc_save', JSON.stringify({ player: player, teams: currentLeagueTeams }));
        }

        function resetCareer() {
            if (confirm("هل تريد مسح المسيرة والبدء من جديد في الدوري التونسي؟")) {
                localStorage.removeItem('separated_fc_save');
                location.reload();
            }
        }

        function showView(screenId) {
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('teams-screen').style.display = 'none';
            document.getElementById(screenId).style.display = 'block';
        }

        function updateUI() {
            document.getElementById('p-name').innerText = player.name;
            document.getElementById('p-club').innerText = player.club || "غير محدد";
            document.getElementById('p-league').innerText = player.league || "غير محدد";
            document.getElementById('p-stars').innerText = player.clubStars;
            document.getElementById('p-season').innerText = player.season;
            document.getElementById('p-match-round').innerText = player.matchesPlayed;
            document.getElementById('p-points').innerText = player.points;
            document.getElementById('p-rank').innerText = player.rank;
            document.getElementById('p-goals').innerText = player.goals;
        }

        function renderTeamsTable() {
            document.getElementById('table-title').innerText = `ترتيب ${player.league}`;
            let ul = document.getElementById('teams-list-ul');
            ul.innerHTML = "";
            let sorted = [...currentLeagueTeams].sort((a, b) => b.points - a.points);
            sorted.forEach((t, index) => {
                let li = document.createElement('li');
                li.innerHTML = `${index + 1}. ${t.name} — <strong>${t.points} نقطة</strong> (${t.stars} ⭐)`;
                if(t.name === player.club) li.style.color = "#5bc0be";
                ul.appendChild(li);
            });
        }

        function playMatch() {
            if (player.matchesPlayed >= 30) return;
            player.matchesPlayed++;

            // محاكاة النقاط لباقي فرق الدوري
            currentLeagueTeams.forEach(team => {
                if (team.name === player.club) team.points = player.points;
                else team.points += (Math.random() > 0.5 ? 3 : (Math.random() > 0.4 ? 1 : 0));
            });

            let opp;
            do { opp = currentLeagueTeams[Math.floor(Math.random() * currentLeagueTeams.length)]; } while (opp.name === player.club);

            let diff = player.clubStars - opp.stars + ((Math.random() * 2) - 1);
            let myG = 0, oppG = 0, resText = "";

            if (diff > 0.5) {
                myG = Math.floor(Math.random() * 3) + 1;
                oppG = Math.floor(Math.random() * myG);
                resText = `🎉 انتصار على ${opp.name} (${myG}-${oppG})`;
                player.points += 3;
            } else if (diff < -0.5) {
                oppG = Math.floor(Math.random() * 3) + 1;
                myG = Math.floor(Math.random() * oppG);
                resText = `💔 هزيمة أمام ${opp.name} (${myG}-${oppG})`;
            } else {
                myG = Math.floor(Math.random() * 2);
                oppG = myG;
                resText = `🤝 تعادل مع ${opp.name} (${myG}-${oppG})`;
                player.points += 1;
            }

            let pTeam = currentLeagueTeams.find(t => t.name === player.club);
            if (pTeam) pTeam.points = player.points;

            // تحديث الترتيب فوراً بعد الجولة
            currentLeagueTeams.sort((a, b) => b.points - a.points);
            player.rank = currentLeagueTeams.findIndex(t => t.name === player.club) + 1;

            if (myG > 0 && Math.random() > 0.4) {
                player.goals++;
                resText += " ⚽ [سجلت هدفاً!]";
            }

            document.getElementById('match-announcement').innerHTML = resText;
            updateUI();
            saveData();

            if (player.matchesPlayed >= 30) triggerEndOfSeason();
        }

        function triggerEndOfSeason() {
            document.getElementById('continental-result-box').innerText = `أنهيت موسمك في ${player.league} بالمركز ${player.rank}!`;
            
            let allTeamsFlat = [];
            Object.keys(leaguesData).forEach(lg => {
                leaguesData[lg].forEach(tm => {
                    if (tm.name !== player.club) allTeamsFlat.push({ name: tm.name, league: lg, stars: tm.stars });
                });
            });

            let shuffled = allTeamsFlat.sort(() => 0.5 - Math.random()).slice(0, 3);
            let container = document.getElementById('offers-list-container');
            container.innerHTML = "";
            
            shuffled.forEach((offer) => {
                let btn = document.createElement('button');
                btn.style.backgroundColor = "#2a9d8f";
                btn.style.color = "#fff";
                btn.style.marginTop = "6px";
                btn.innerHTML = `✍️ انتقال إلى: ${offer.name} (${offer.league} - ${offer.stars} ⭐)`;
                
                let applyOffer = function() {
                    player.club = offer.name;
                    player.league = offer.league;
                    player.clubStars = offer.stars;
                    currentLeagueTeams = JSON.parse(JSON.stringify(leaguesData[offer.league]));
                    currentLeagueTeams.forEach(t => t.points = 0);
                    finishSeasonTransition("تم الانتقال بنجاح للدوري الجديد!");
                };

                btn.addEventListener('click', applyOffer);
                btn.addEventListener('touchend', function(e) { e.preventDefault(); applyOffer(); }, {passive: false});
                container.appendChild(btn);
            });

            document.getElementById('transfer-offer-box').style.display = 'block';
            document.getElementById('play-match-btn').style.display = 'none';
            saveData();
        }

        function rejectOffers() {
            finishSeasonTransition("تجديد العقد والاستمرار في نفس الدوري.");
        }

        function finishSeasonTransition(msg) {
            player.season++;
            player.matchesPlayed = 0;
            player.points = 0;
            player.goals = 0;
            player.rank = 10;
            currentLeagueTeams.forEach(t => t.points = 0);
            
            updateUI();
            document.getElementById('match-announcement').innerHTML = `<strong>نهاية الموسم:</strong> ${msg}<br>🚀 انطلق الموسم رقم ${player.season}!`;
            document.getElementById('transfer-offer-box').style.display = 'none';
            document.getElementById('play-match-btn').style.display = 'block';
            saveData();
        }
    </script>
</body>
</html>
