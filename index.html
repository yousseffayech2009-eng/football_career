<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Career</title>
    <style>
        body { background-color: #0b132b; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 15px; direction: rtl; }
        .card { background: #1c2541; border-radius: 12px; padding: 20px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        button { cursor: pointer; font-weight: bold; border-radius: 8px; border: none; width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; background-color: #5bc0be; color: #0b132b; }
        input { width: 90%; padding: 12px; text-align: center; border-radius: 8px; border: 2px solid #5bc0be; background: #0b132b; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; }
        .match-box-style { background: #0b132b; padding: 12px; border-radius: 8px; margin: 10px 0; border: 1px solid #5bc0be; text-align: right; }
        .teams-list { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; text-align: right; }
        .teams-list li { padding: 6px 0; border-bottom: 1px solid #3a506b; font-size: 14px; }
    </style>
</head>
<body>

    <div id="game-container" style="max-width: 500px; margin: 0 auto;">
        <!-- شاشة البداية -->
        <div id="setup-screen" class="card">
            <h1>⭐ Football Career ⭐</h1>
            <p>أدخل اسمك الشجاع للبدء:</p>
            <input type="text" id="player-input-name" value="يوسف">
            <button onclick="startCareer()">انطلق نحو النجومية 🚀</button>
            <button id="load-btn" onclick="loadCareer()" style="background-color: #f77f00; color: #fff; display:none;">استكمال المسيرة المحفوظة 📂</button>
        </div>

        <!-- واجهة اللعب الرئيسية -->
        <div id="game-main-interface" style="display:none;">
            <div class="card" style="text-align: right;">
                <h3>لوحة القيادة والمباريات</h3>
                <p>اللاعب: <strong id="p-name">--</strong> | النادي: <strong id="p-club">--</strong> (<span id="p-stars">3</span> ⭐)</p>
                <p>📅 الجولة: <strong id="p-match-round">0</strong> من 30 | 🏆 النقاط: <strong id="p-points">0</strong> | 📊 الترتيب: <strong id="p-rank">-</strong> | ⚽ أهدافك: <strong id="p-goals">0</strong></p>
                
                <div class="match-box-style">
                    <h4>🏟️ المواجهة القادمة</h4>
                    <p id="match-announcement">اضغط على زر خوض المباراة للبدء.</p>
                </div>

                <div id="transfer-offer-box" style="display:none; background: #3a1c0b; padding: 15px; border-radius: 8px; margin: 15px 0; border: 2px solid #ffb703;">
                    <h4>🌟 سوق الانتقالات (نهاية الموسم)</h4>
                    <p id="offer-text">انتهى الموسم!</p>
                    <div id="continental-result-box" style="margin: 10px 0; font-weight: bold; color: #6fffe9;"></div>
                    <div id="offers-list-container"></div>
                    <button onclick="rejectOffers()" style="background-color: #e76f51; color: #fff;">البقاء مع ناديك 🛡️</button>
                </div>

                <button id="play-match-btn" onclick="playMatch()">خوض الجولة الحالية ⚽</button>
                <button onclick="resetGame()" style="background-color: #d90429; color: #fff; font-size: 12px; padding: 10px;">إعادة تعيين المسيرة 🔄</button>
            </div>
        </div>
    </div>

    <script>
        let player = { name: "", club: "", clubStars: 3, season: 1, goals: 0, matchesPlayed: 0, points: 0, rank: 10 };

        const tunisianTeamsData = [
            { name: "Club Africain", stars: 4.5, points: 0 },
            { name: "Esperance Tunis", stars: 4.5, points: 0 },
            { name: "CS Sfaxien", stars: 4.0, points: 0 },
            { name: "Stade Tunisien", stars: 3.5, points: 0 },
            { name: "Monastir", stars: 3.5, points: 0 },
            { name: "Zarzis", stars: 3.0, points: 0 },
            { name: "Etoile Sahel", stars: 3.0, points: 0 },
            { name: "Metlaoui", stars: 3.0, points: 0 },
            { name: "JS Omrane", stars: 2.5, points: 0 },
            { name: "Ben Guerdane", stars: 2.5, points: 0 },
            { name: "Marsa", stars: 2.5, points: 0 },
            { name: "CA Bizertin", stars: 2.5, points: 0 },
            { name: "Olympique Beja", stars: 2.0, points: 0 },
            { name: "Kairouanaise", stars: 2.0, points: 0 },
            { name: "Soliman", stars: 2.0, points: 0 },
            { name: "AS Gabes", stars: 2.0, points: 0 }
        ];

        const easternEuropeAndStrongLocalTeams = [
            { name: "نادي فرينكفاروش المجري 🇭🇺", stars: 3.5 },
            { name: "نادي دينامو زغرب الكرواتي 🇭🇷", stars: 4.0 },
            { name: "نادي سلافا براغ التشيكي 🇨🇿", stars: 3.5 },
            { name: "نادي لوكوموتيف موسكو الروسي 🇷🇺", stars: 4.0 },
            { name: "Club Africain 🇹🇳", stars: 4.5 },
            { name: "Esperance Tunis 🇹🇳", stars: 4.5 }
        ];

        let availableOffers = [];

        window.onload = function() {
            if (localStorage.getItem('football_career_save')) {
                document.getElementById('load-btn').style.display = 'block';
            }
        };

        function saveGame() {
            localStorage.setItem('football_career_save', JSON.stringify({ player, teams: tunisianTeamsData }));
        }

        function startCareer() {
            let nameInput = document.getElementById('player-input-name').value.trim();
            if(!nameInput) { alert("أدخل الاسم!"); return; }
            player.name = nameInput;
            let randTeam = tunisianTeamsData[Math.floor(Math.random() * tunisianTeamsData.length)];
            player.club = randTeam.name;
            player.clubStars = randTeam.stars;
            player.season = 1; player.goals = 0; player.matchesPlayed = 0; player.points = 0; player.rank = 10;
            tunisianTeamsData.forEach(t => t.points = 0);
            saveGame();
            updateUI();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-main-interface').style.display = 'block';
        }

        function loadCareer() {
            let saved = localStorage.getItem('football_career_save');
            if(!saved) return;
            let data = JSON.parse(saved);
            player = data.player;
            if(data.teams) {
                data.teams.forEach(st => {
                    let t = tunisianTeamsData.find(item => item.name === st.name);
                    if(t) t.points = st.points;
                });
            }
            updateUI();
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-main-interface').style.display = 'block';
        }

        function resetGame() {
            if(confirm("مسح المسيرة والبدء من جديد؟")) {
                localStorage.removeItem('football_career_save');
                location.reload();
            }
        }

        function updateUI() {
            document.getElementById('p-name').innerText = player.name;
            document.getElementById('p-club').innerText = player.club;
            document.getElementById('p-stars').innerText = player.clubStars;
            document.getElementById('p-season').innerText = player.season;
            document.getElementById('p-match-round').innerText = player.matchesPlayed;
            document.getElementById('p-points').innerText = player.points;
            document.getElementById('p-rank').innerText = player.rank;
            document.getElementById('p-goals').innerText = player.goals;
        }

        function playMatch() {
            if (player.matchesPlayed >= 30) return;
            player.matchesPlayed++;

            tunisianTeamsData.forEach(team => {
                if (team.name === player.club) team.points = player.points;
                else team.points += (Math.random() > 0.5 ? 3 : 1);
            });

            let opp;
            do { opp = tunisianTeamsData[Math.floor(Math.random() * tunisianTeamsData.length)]; } while (opp.name === player.club);

            let diff = player.clubStars - opp.stars + ((Math.random() * 2) - 1);
            let myG = 0, oppG = 0, text = "";

            if (diff > 0.5) {
                myG = Math.floor(Math.random() * 3) + 1;
                oppG = Math.floor(Math.random() * myG);
                text = `انتصار على ${opp.name} (${myG}-${oppG})`;
                player.points += 3;
            } else if (diff < -0.5) {
                oppG = Math.floor(Math.random() * 3) + 1;
                myG = Math.floor(Math.random() * oppG);
                text = `هزيمة أمام ${opp.name} (${myG}-${oppG})`;
            } else {
                myG = Math.floor(Math.random() * 2);
                oppG = myG;
                text = `تعادل مع ${opp.name} (${myG}-${oppG})`;
                player.points += 1;
            }

            let pTeam = tunisianTeamsData.find(t => t.name === player.club);
            if (pTeam) pTeam.points = player.points;

            tunisianTeamsData.sort((a, b) => b.points - a.points);
            player.rank = tunisianTeamsData.findIndex(t => t.name === player.club) + 1;

            if (myG > 0 && Math.random() > 0.4) {
                player.goals++;
                text += " [سجلت هدفاً!]";
            }

            document.getElementById('match-announcement').innerText = text;
            updateUI();
            saveGame();

            if (player.matchesPlayed >= 30) triggerEndOfSeasonOffers();
        }

        function triggerEndOfSeasonOffers() {
            document.getElementById('continental-result-box').innerText = `أنهيت الدوري في المركز ${player.rank}`;
            availableOffers = [];
            let pool = [...easternEuropeAndStrongLocalTeams].sort(() => 0.5 - Math.random());
            for(let t of pool) {
                if(t.name !== player.club && availableOffers.length < 3) availableOffers.push(t);
            }

            let container = document.getElementById('offers-list-container');
            container.innerHTML = "";
            availableOffers.forEach((offer, idx) => {
                let b = document.createElement('button');
                b.style.backgroundColor = "#2a9d8f"; b.style.color = "#fff"; b.style.margin = "5px 0";
                b.innerHTML = `انتقال إلى: ${offer.name} (${offer.stars} ⭐)`;
                b.onclick = () => {
                    player.club = offer.name;
                    player.clubStars = offer.stars;
                    finishSeason("تم الانتقال بنجاح!");
                };
                container.appendChild(b);
            });

            document.getElementById('transfer-offer-box').style.display = 'block';
            document.getElementById('play-match-btn').style.display = 'none';
            saveGame();
        }

        function rejectOffers() { finishSeason("مواصلة المشوار مع النادي الحالي."); }

        function finishSeason(msg) {
            player.season++;
            player.matchesPlayed = 0; player.points = 0; player.goals = 0; player.rank = 10;
            tunisianTeamsData.forEach(t => t.points = 0);
            updateUI();
            document.getElementById('match-announcement').innerText = msg + " انطلق الموسم الجديد!";
            document.getElementById('transfer-offer-box').style.display = 'none';
            document.getElementById('play-match-btn').style.display = 'block';
            saveGame();
        }
    </script>
</body>
</html>
