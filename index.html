<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>football_career by youssef v16</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        button, input, select { padding: 12px; margin: 8px 0; width: 100%; font-size: 16px; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background-color: #28a745; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; }
        input, select { background: #333; color: white; text-align: center; }
        .btn-action { background-color: #007bff; margin-top: 10px; }
        .btn-action:hover { background-color: #0056b3; }
        #stats-panel { display: flex; justify-content: space-around; background: #2a2a2a; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px; }
        #game-log { text-align: right; background: #252525; padding: 15px; border-radius: 5px; height: 220px; overflow-y: auto; margin-top: 15px; font-size: 14px; border: 1px solid #444; }
        .offer-card { background: #333; border: 1px solid #28a745; padding: 10px; margin: 10px 0; border-radius: 5px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚽ football_career by youssef ⚽</h2>

    <div id="setup-screen">
        <input type="text" id="player-name" placeholder="أدخل اسم اللاعب">
        <select id="player-pos">
            <option value="مهاجم">مهاجم</option>
            <option value="وسط">وسط</option>
            <option value="دفاع">دفاع</option>
            <option value="حارس">حارس</option>
        </select>
        <select id="league-select">
            <option value="الدوري التونسي">الدوري التونسي</option>
            <option value="الدوري المصري">الدوري المصري</option>
            <option value="الدوري الجزائري">الدوري الجزائري</option>
            <option value="الدوري المغربي">الدوري المغربي</option>
            <option value="الدوري السعودي">الدوري السعودي</option>
            <option value="الدوري الفرنسي">الدوري الفرنسي</option>
            <option value="الدوري الألماني">الدوري الألماني</option>
            <option value="الدوري الإيطالي">الدوري الإيطالي</option>
            <option value="الدوري الإسباني">الدوري الإسباني</option>
            <option value="الدوري الإنجليزي الممتاز">الدوري الإنجليزي الممتاز</option>
        </select>
        <button onclick="startGame()">بدء المسيرة</button>
    </div>

    <div id="game-screen" style="display:none;">
        <h3 id="status-bar"></h3>
        
        <div id="stats-panel">
            <div>الموسم: <span id="stat-season">1</span>/22</div>
            <div>المرحلة: <span id="stat-phase">الدوري المحلي</span></div>
            <div>الأهداف: <span id="stat-goals">0</span></div>
            <div>الطاقة: <span id="stat-overall">65</span></div>
            <div>الترتيب: <span id="stat-rank">1</span></div>
        </div>

        <div id="game-log"></div>

        <div id="actions-area">
            <button class="btn-action" onclick="playMatch()">خوض المباراة القادمة ⚽</button>
            <button id="train-btn" class="btn-action" style="background-color: #e0a800;" onclick="trainPlayer()" disabled>تدريب (+الطاقة) 🏋️‍♂️ (يلزم 3 مباريات)</button>
        </div>

        <div id="offers-area" style="display:none;">
            <h3>📝 نهاية الموسم وسوق الانتقالات</h3>
            <div id="season-summary" style="margin-bottom:15px; font-weight:bold; color:#28a745;"></div>
            <div id="offers-list" style="max-height: 250px; overflow-y: auto;"></div>
            <button id="next-season-btn" onclick="startNewSeason()" style="background-color: #6c757d;">البقاء مع الفريق الحالي لـ موسم آخر</button>
        </div>
    </div>
</div>

<script>
    const database = {
        "الدوري التونسي": ["الترجي الرياضي", "النادي الإفريقي", "النجم الساحلي", "الصفاقسي", "الملعب التونسي", "الاتحاد المنستيري", "اتحاد بن قردان", "الأولمبي الباجي", "مستقبل سليمان", "اتحاد تطاوين", "قوافل قفصة", "نجم المتلوي", "مستقبل قابس", "الشبيبة القيروانية", "أمل حمام سوسة", "هلال الشابة", "النادي البنزرتي", "مكارم مهدية"],
        "الدوري المصري": ["الأهلي", "الزمالك", "بيراميدز", "المصري البورسعيدي", "سيراميكا كليوباترا", "البنك الأهلي", "فاركو", "الاتحاد السكندري", "سموحة", "الإسماعيلي", "طلائع الجيش", "إنبي", "زد إف سي", "غزل المحلة", "حرس الحدود", "بتروجت", "المقاولون العرب", "سموحة الرياضي"],
        "الدوري الجزائري": ["مولودية الجزائر", "شباب بلوزداد", "اتحاد الجزائر", "شبيبة القبائل", "وفاق سطيف", "شبيبة الساورة", "نادي بارادو", "اتحاد خنشلة", "أولمبي الشلف", "نجم مقرة", "اتحاد بسكرة", "اتحاد العاصمة", "مولودية وجدة", "شبيبة بجاية", "ترجي مستغانم", "اتحاد سوف", "نصر حسين داي", "رائد القبة"],
        "الدوري المغربي": ["الوداد الرياضي", "الرجاء الرياضي", "نهضة بركان", "الجيش الملكي", "الفتح الرياضي", "المغرب الفاسي", "حسنية أكادير", "اتحاد طنجة", "نهضة الزمامرة", "أولمبيك آسفي", "شباب السوالم", "اتحاد تواركة", "المغرب التطواني", "الدفاع الحسني الجديدي", "سريع واد زم", "الشباب الرياضي السالمي", "الرجاء البلالي", "نهضة سطات"],
        "الدوري السعودي": ["الهلال", "النصر", "الاتحاد", "الأهلي", "الشباب", "التعاون", "الاتفاق", "الفتح", "الرياض", "الخليج", "ضمك", "الرائد", "الوحدة", "الأخدود", "الخلود", "العروبة", "نيوم", "الفيصلي"],
        "الدوري الفرنسي": ["باريس سان جيرمان", "مارسيليا", "موناكو", "ليون", "ليل", "نيس", "ستراسبورغ", "لانس", "رين", "تولوز", "بريست", "مونبلييه", "ستاد ريمس", "لوهافر", "نانت", "أنجيه", "سنت إتيان", "ميتز"],
        "الدوري الألماني": ["بايرن ميونخ", "بوروسيا دورتموند", "باير ليفركوزن", "لايبزيغ", "آنتراخت فرانكفورت", "شتوتغارت", "فولفسبورغ", "فرايبورغ", "هوفنهايم", "أوغسبورغ", "فيردر بريمن", "ماينز 05", "بروسيا مونشنغلادباخ", "بوخوم", "هايدنهايم", "سانت باولي", "كولن", "يونيون برلين"],
        "الدوري الإيطالي": ["إنتر ميلان", "يوفنتوس", "إيه سي ميلان", "نابولي", "أتالانتا", "لاتسيو", "روما", "فيورنتينا", "بولونيا", "تورينو", "مونزا", "جنوى", "ليتشي", "كالياري", "إمبولي", "هيلاس فيرونا", "بارما", "أودينيزي"],
        "الدوري الإسباني": ["ريال مدريد", "برشلونة", "أتلتيكو مدريد", "أتلتيك بلباو", "ريال سوسيداد", "فياريال", "ريال بيتيس
    let player = {
        name: "",
        pos: "",
        league: "",
        team: "",
        season: 1,
        phase: "league",
        matchIndex: 0,
        goals: 0,
        overall: 65,
        matchesSinceLastTrain: 0
    };

    let fixtures = [];
    let leagueTable = {};
    let continentalMatches = [];
    let continentalMatchIndex = 0;
    let continentalName = "";
    const TOTAL_SEASONS = 22;
    const TOTAL_MATCHES = 34;

    function getTeamTier(teamName, leagueName) {
        let teams = database[leagueName];
        if (!teams) return 2;
        let index = teams.indexOf(teamName);
        if (index <= 2) return 3;
        if (index <= 10) return 2;
        return 1;
    }

    function startGame() {
        const nameInput = document.getElementById("player-name").value.trim();
        if (!nameInput) {
            alert("الرجاء إدخال اسم اللاعب!");
            return;
        }

        player.name = nameInput;
        player.pos = document.getElementById("player-pos").value;
        player.league = document.getElementById("league-select").value;

        const teams = database[player.league];
        player.team = teams[Math.floor(Math.random() * teams.length)];

        document.getElementById("setup-screen").style.display = "none";
        document.getElementById("game-screen").style.display = "block";

        initSeason();
        log(`مرحباً بك يا <strong>${player.name}</strong>! انطلقت مسيرتك مع نادي <strong>${player.team}</strong> في <strong>${player.league}</strong>.`);
    }

    function initSeason() {
        player.phase = "league";
        player.matchIndex = 0;
        player.matchesSinceLastTrain = 0;
        const teams = database[player.league];
        leagueTable = {};
        teams.forEach(t => leagueTable[t] = 0);

        fixtures = [];
        let opponents = teams.filter(t => t !== player.team);
        
        for (let m = 0; m < TOTAL_MATCHES; m++) {
            let opponent = opponents[m % opponents.length];
            if (m < 17) {
                fixtures.push({ home: player.team, away: opponent });
            } else {
                fixtures.push({ home: opponent, away: player.team });
            }
        }

        updateTrainButton();
        updateUI();
    }

    function updateUI() {
        document.getElementById("status-bar").innerText = `${player.name} | ${player.pos} | ${player.team}`;
        document.getElementById("stat-season").innerText = player.season;
        document.getElementById("stat-overall").innerText = player.overall;
        document.getElementById("stat-goals").innerText = player.goals;

        if (player.phase === "league") {
            document.getElementById("stat-phase").innerText = "الدوري المحلي";
            document.getElementById("stat-match").innerText = `${player.matchIndex + 1}/${TOTAL_MATCHES}`;
            let sortedTeams = Object.keys(leagueTable).sort((a,b) => (leagueTable[b] || 0) - (leagueTable[a] || 0));
            let rank = sortedTeams.indexOf(player.team) + 1;
            document.getElementById("stat-rank").innerText = rank > 0 ? rank : 1;
        } else if (player.phase === "continental") {
            document.getElementById("stat-phase").innerText = continentalName;
            document.getElementById("stat-match").innerText = `${continentalMatchIndex + 1}/${continentalMatches.length}`;
            document.getElementById("stat-rank").innerText = "قاري";
        }
    }

    function updateTrainButton() {
        const trainBtn = document.getElementById("train-btn");
        if (player.matchesSinceLastTrain >= 3) {
            trainBtn.disabled = false;
            trainBtn.innerText = "تدريب (+الطاقة) 🏋️‍♂️ (متاح الآن!)";
        } else {
            trainBtn.disabled = true;
            trainBtn.innerText = `تدريب (+الطاقة) 🏋️‍♂️ (يلزم ${3 - player.matchesSinceLastTrain} مباراة)`;
        }
    }

    function log(message) {
        const logBox = document.getElementById("game-log");
        logBox.innerHTML = `<p style="margin: 5px 0;">- ${message}</p>` + logBox.innerHTML;
    }

    function playMatch() {
        if (player.phase === "league") {
            playLeagueMatch();
        } else if (player.phase === "continental") {
            playContinentalMatch();
        }
    }

    function playLeagueMatch() {
        if (player.matchIndex >= TOTAL_MATCHES) {
            checkLeagueEnd();
            return;
        }

        let match = fixtures[player.matchIndex];
        let homeTeam = match.home;
        let awayTeam = match.away;

        let teams = database[player.league];
        let processedTeams = new Set([homeTeam, awayTeam]);

        teams.forEach(t => {
            if (!processedTeams.has(t)) {
                let availableOpponents = teams.filter(x => x !== t && !processedTeams.has(x));
                if (availableOpponents.length > 0) {
                    let opp = availableOpponents[Math.floor(Math.random() * availableOpponents.length)];
                    processedTeams.add(t);
                    processedTeams.add(opp);

                    let tTier = getTeamTier(t, player.league);
                    let oppTier = getTeamTier(opp, player.league);
                    let tGoals = Math.floor(Math.random() * (tTier + 1));
                    let oGoals = Math.floor(Math.random() * (oppTier + 1));

                    if (tGoals > oGoals) leagueTable[t] = (leagueTable[t] || 0) + 3;
                    else if (oGoals > tGoals) leagueTable[opp] = (leagueTable[opp] || 0) + 3;
                    else {
                        leagueTable[t] = (leagueTable[t] || 0) + 1;
                        leagueTable[opp] = (leagueTable[opp] || 0) + 1;
                    }
                }
            }
        });

        let homeTier = getTeamTier(homeTeam, player.league);
        let awayTier = getTeamTier(awayTeam, player.league);
        let teamTier = getTeamTier(player.team, player.league);

        let homeGoals = Math.floor(Math.random() * (homeTier + 1));
        let awayGoals = Math.floor(Math.random() * (awayTier + 1));

        let scored = 0;
        let isMyMatch = (homeTeam === player.team || awayTeam === player.team);

        if (isMyMatch) {
            let chance = Math.random();
            let successRate = 0.68 - (player.overall * 0.0025) - (teamTier * 0.035);

            if (chance > successRate) {
                if (player.pos === "مهاجم") scored = Math.random() > 0.82 ? 2 : 1;
                else if (player.pos === "وسط" && Math.random() > 0.7) scored = 1;
                else if (player.pos === "دفاع" && Math.random() > 0.9) scored = 1;
            }

            player.goals += scored;

            if (homeTeam === player.team) homeGoals += scored;
            else awayGoals += scored;

            player.matchesSinceLastTrain++;
            updateTrainButton();
        }

        if (homeGoals > awayGoals) {
            leagueTable[homeTeam] = (leagueTable[homeTeam] || 0) + 3;
        } else if (awayGoals > homeGoals) {
            leagueTable[awayTeam] = (leagueTable[awayTeam] || 0) + 3;
        } else {
            leagueTable[homeTeam] = (leagueTable[homeTeam] || 0) + 1;
            leagueTable[awayTeam] = (leagueTable[awayTeam] || 0) + 1;
        }

        if (isMyMatch) {
            let opponent = homeTeam === player.team ? awayTeam : homeTeam;
            let myGoals = homeTeam === player.team ? homeGoals : awayGoals;
            let oppGoals = homeTeam === player.team ? awayGoals : homeGoals;
            let resText = myGoals > oppGoals ? "فوز مستحق 🎉" : (myGoals === oppGoals ? "تعادل 🤝" : "هزيمة قاسية 💔");
            let goalStatus = scored > 0 ? `⚽ سجلت ${scored} هدف` : `🛑 صيام تهديفي`;
            
            log(`الجولة ${player.matchIndex + 1}: ${player.team} ${myGoals} - ${oppGoals} ${opponent} (${resText}) - ${goalStatus}`);
        }

        player.matchIndex++;
        updateUI();

        if (player.matchIndex >= TOTAL_MATCHES) {
            checkLeagueEnd();
        }
    }

    function checkLeagueEnd() {
        let sortedTeams = Object.keys(leagueTable).sort((a,b) => (leagueTable[b] || 0) - (leagueTable[a] || 0));
        let rank = sortedTeams.indexOf(player.team) + 1;

        let isTopEuro = topEuropeanLeagues.includes(player.league);
        let isAfrican = africanLeagues.includes(player.league);
        let isAsian = asianLeagues.includes(player.league);

        if (isTopEuro && rank <= 4) {
            continentalName = "دوري أبطال أوروبا 🏆⭐";
            setupContinentalTournament();
        } else if (isAfrican && rank === 1) {
            continentalName = "دوري أبطال أفريقيا 🏆🌍";
            setupContinentalTournament();
        } else if (isAsian && rank <= 3) {
            continentalName = "دوري أبطال آسيا 🏆🌏";
            setupContinentalTournament();
        } else {
            endSeason();
        }
    }

    function setupContinentalTournament() {
        player.phase = "continental";
        continentalMatchIndex = 0;
        continentalMatches = [
            { stage: "مرحلة المجموعات - الجولة 1", opponent: "خصم قاري قوي (افتتاحي)" },
            { stage: "مرحلة المجموعات - الجولة 2", opponent: "خصم قاري قوي (خارج الديار)" },
            { stage: "ربع النهائي القاري", opponent: "عملاق الدور ربع النهائي" },
            { stage: "نصف النهائي القاري", opponent: "كبار القارة (نصف النهائي)" },
            { stage: "نهائي البطولات الكبرى ⭐", opponent: "نهائي الحلم القاري المنتظر" }
        ];
        log(`🌟 <strong>تأهل قاري رسمي!</strong> انتقلت إلى مباريات ${continentalName}. استعد لمعارك قوية مع عمالقة القارة!`);
        updateUI();
    }

    function playContinentalMatch() {
        if (continentalMatchIndex >= continentalMatches.length) return;

        let currentMatch = continentalMatches[continentalMatchIndex];
        let opponent = currentMatch.opponent;

        let myGoals = Math.floor(Math.random() * 2);
        let oppGoals = Math.floor(Math.random() * 3);

        let scored = 0;
        let chance = Math.random();
        let successRate = 0.60 - (player.overall * 0.003);

        if (chance > successRate) {
            if (player.pos === "مهاجم") scored = Math.random() > 0.8 ? 2 : 1;
            else if (player.pos === "وسط" && Math.random() > 0.65) scored = 1;
            else if (player.pos === "دفاع" && Math.random() > 0.9) scored = 1;
        }

        player.goals += scored;
        myGoals += scored;

        let resText = myGoals > oppGoals ? "انتصار قاري بطولي 🎉" : (myGoals === oppGoals ? "تعادل في قمة قارية 🤝" : "هزيمة قارية صعبة 💔");
        let goalStatus = scored > 0 ? `⚽ سجلت ${scored} هدف` : `🛑 صيام عن التهديف`;

        log(`[${currentMatch.stage}] ${player.team} ${myGoals} - ${oppGoals} ${opponent} (${resText}) - ${goalStatus}`);

        player.matchesSinceLastTrain++;
        updateTrainButton();

        continentalMatchIndex++;
        updateUI();

        if (continentalMatchIndex >= continentalMatches.length) {
            log(`🏆 اختتمت مشوار المنافسة في ${continentalName} بنجاح.`);
            endSeason();
        }
    }

    function trainPlayer() {
        if (player.matchesSinceLastTrain >= 3 && player.overall < 99) {
            player.overall += 1;
            player.matchesSinceLastTrain = 0;
            updateTrainButton();
            log(`🏋️‍♂️ خضت تدريبات مكثفة! ارتفعت طاقتك وأصبحت <strong>${player.overall}</strong>.`);
            updateUI();
        }
    }

    function endSeason() {
        player.phase = "ended";
        document.getElementById("actions-area").style.display = "none";
        document.getElementById("offers-area").style.display = "block";

        let sortedTeams = Object.keys(leagueTable).sort((a,b) => (leagueTable[b] || 0) - (leagueTable[a] || 0));
        let rank = sortedTeams.indexOf(player.team) + 1;

        if (player.season >= TOTAL_SEASONS) {
            document.getElementById("season-summary").innerHTML = `
                🏁 <strong>انتهت مسيرتك الاحترافية بنجاح بعد الوصول إلى الحد الأقصى (22 موسماً)!</strong><br>
                أهلاً بك في اعتزال اللعب بسجل حافل من الأهداف.
            `;
            document.getElementById("offers-list").innerHTML = "";
            document.getElementById("next-season-btn").style.display = "none";
            log(`🌟 <strong>اعتزال اللاعب:</strong> وصلت إلى نهاية مسيرتك الكروية بعد 22 موسماً رائعاً.`);
            return;
        }

        document.getElementById("season-summary").innerHTML = `
            إنهاء الموسم ${player.season} في الدوري المحلي بالمركز <strong>#${rank}</strong> برصيد ${leagueTable[player.team] || 0} نقطة.<br>
            وتمت المشاركة في المحطات القارية بنجاح.
        `;

        log(`🏁 <strong>انتهاء الموسم ${player.season}!</strong> انتقل الآن إلى سوق الانتقالات.`);
        generateOffers();
    }

    function generateOffers() {
        const offersList = document.getElementById("offers-list");
        offersList.innerHTML = "";

        let availableLeagues = Object.keys(database);
        if (player.season < 4 && player.overall < 78) {
            availableLeagues = availableLeagues.filter(l => !topEuropeanLeagues.includes(l));
        }

        for (let i = 0; i < 4; i++) {
            let randomLeague = availableLeagues[Math.floor(Math.random() * availableLeagues.length)];
            let teamList = database[randomLeague];
            let randomTeam = teamList[Math.floor(Math.random() * teamList.length)];

            let div = document.createElement("div");
            div.className = "offer-card";
            div.innerHTML = `
                <strong>نادي: ${randomTeam}</strong> (${randomLeague})<br>
                <button onclick="acceptOffer('${randomTeam}', '${randomLeague}')" style="margin-top:5px; padding:5px;">قبول العرض والانتقال ✈️</button>
            `;
            offersList.appendChild(div);
        }
    }

    function acceptOffer(newTeam, newLeague) {
        player.team = newTeam;
        player.league = newLeague;
        log(`✍️ وقعت رسمياً مع نادي <strong>${player.team}</strong> في <strong>${player.league}</strong>!`);
        startNewSeason();
    }

    function startNewSeason() {
        if (player.season >= TOTAL_SEASONS) return;
        player.season++;
        document.getElementById("offers-area").style.display = "none";
        document.getElementById("actions-area").style.display = "block";
        initSeason();
        log(`🚀 **بداية الموسم الجديد ${player.season}** مع فريق ${player.team}. بالتوفيق!`);
    }
</script>

</body>
</html>
